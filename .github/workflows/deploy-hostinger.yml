name: Deploy to Hostinger

on:
  workflow_run:
    workflows: ['Frontend CI', 'Backend CI']
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

jobs:
  deploy-frontend:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Frontend CI')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build production bundle
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_DEMO_MODE: 'false'
        run: npm run build

      - name: Copy SPA routing config into build output
        run: cp deploy/wellness/.htaccess dist/.htaccess

      - name: Load Hostinger SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Deploy dist/ to Hostinger via rsync over SSH
        env:
          SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts
          ssh -p "$SSH_PORT" "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" 'mkdir -p public_html/wellness'
          rsync -avz --delete -e "ssh -p $SSH_PORT" \
            ./dist/ \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:public_html/wellness/"

  deploy-backend:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Backend CI')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Load Hostinger SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Deploy backend to Hostinger via rsync over SSH
        env:
          SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts
          ssh -p "$SSH_PORT" "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" 'mkdir -p public_html/api-wellness'
          rsync -avz --delete \
            --exclude='.git*' \
            --exclude='tests/' \
            --exclude='.env' \
            --exclude='.env.*' \
            -e "ssh -p $SSH_PORT" \
            ./ \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:public_html/api-wellness/"

      - name: Render production .env from secrets
        env:
          APP_KEY: ${{ secrets.LARAVEL_APP_KEY }}
          DB_DATABASE: ${{ secrets.HOSTINGER_DB_DATABASE }}
          DB_USERNAME: ${{ secrets.HOSTINGER_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.HOSTINGER_DB_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.HOSTINGER_MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.HOSTINGER_MAIL_PASSWORD }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          cat > .env.deploy <<EOF
          APP_NAME=WellnessConnect
          APP_ENV=production
          APP_KEY=${APP_KEY}
          APP_DEBUG=false
          APP_URL=https://api-wellness.khajamynuddin.com

          FRONTEND_URL=https://wellness.khajamynuddin.com
          CORS_ALLOWED_ORIGINS=https://wellness.khajamynuddin.com,capacitor://localhost,http://localhost
          SANCTUM_STATEFUL_DOMAINS=wellness.khajamynuddin.com,api-wellness.khajamynuddin.com,localhost,localhost:6026,127.0.0.1

          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US

          APP_MAINTENANCE_DRIVER=file

          BCRYPT_ROUNDS=12

          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=warning

          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=${DB_DATABASE}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}

          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=.khajamynuddin.com

          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=database

          CACHE_STORE=database

          MAIL_MAILER=smtp
          MAIL_SCHEME=null
          MAIL_HOST=smtp.hostinger.com
          MAIL_PORT=587
          MAIL_USERNAME=${MAIL_USERNAME}
          MAIL_PASSWORD=${MAIL_PASSWORD}
          MAIL_FROM_ADDRESS="noreply@khajamynuddin.com"
          MAIL_FROM_NAME="\${APP_NAME}"

          RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
          RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
          RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}

          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          SANCTUM_TOKEN_EXPIRY_MINUTES=10080

          VITE_APP_NAME="\${APP_NAME}"
          EOF
          sed -i 's/^[[:space:]]*//' .env.deploy

      - name: Upload rendered .env over SSH
        env:
          SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT || '22' }}
        run: |
          scp -P "$SSH_PORT" .env.deploy \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:public_html/api-wellness/.env"
          rm .env.deploy

      - name: Run post-deploy artisan commands
        env:
          SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT || '22' }}
        run: |
          ssh -p "$SSH_PORT" "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" '
            cd public_html/api-wellness &&
            PHP=/opt/alt/php83/usr/bin/php &&
            $PHP artisan migrate --force &&
            $PHP artisan config:cache &&
            $PHP artisan route:cache &&
            $PHP artisan storage:link
          '
