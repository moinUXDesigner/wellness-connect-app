name: CI/CD

# Single unified pipeline: one workflow run == one commit == one set of build
# artifacts. This replaces the old frontend-ci.yml / backend-ci.yml /
# deploy-hostinger.yml trio, whose independent workflow_run-chained triggers
# could deploy frontend and backend independently and let a deploy job rebuild
# dependencies fresh (i.e. NOT the exact code that was tested).
#
# - `frontend` / `backend`: run on every PR and every push to main. No
#   secrets are referenced by either job, so this is safe to run on
#   fork pull requests too. Neither job declares `environment:` -- they must
#   never gain access to production-scoped secrets/vars.
# - `deploy`: only runs for a `push` to `main` (never for `pull_request` or
#   `workflow_dispatch`, on any ref) and only after BOTH `frontend` and
#   `backend` succeed. It downloads the artifacts those jobs already built
#   and tested -- it does not run `npm ci`/`composer install` itself.
#   `environment: production` gates it further: configure that environment's
#   "Deployment branches" to `main` only and add required reviewers in
#   GitHub repo settings (see docs/SECURE_PRODUCTION_DEPLOYMENT.md) -- that
#   is the actual enforcement point, not just this file's `if:` condition.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {} # convenience re-run of frontend/backend checks only; cannot reach the deploy job (see its `if:` below)

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck (blocking)
        run: npm run typecheck

      # VITE_API_URL must be a repository-level variable (Settings -> Secrets
      # and variables -> Actions -> Variables), NOT an environment-scoped one.
      # This job intentionally has no `environment:` (it must run on PRs
      # without any production gating), so an environment-scoped variable
      # would silently resolve empty here. Required value:
      #   VITE_API_URL=https://api-wellness.khajamynuddin.com/api/v1
      # (the /api/v1 suffix is required -- src/app/features/shared/services/
      # api.ts uses this value directly as the request base path with no
      # further path appended by the app itself).
      - name: Build production bundle
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_DEMO_MODE: 'false'
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL repository variable is not set. Expected: https://api-wellness.khajamynuddin.com/api/v1"
            exit 1
          fi
          npm run build

      - name: Copy SPA routing config into build output
        run: cp deploy/wellness/.htaccess dist/.htaccess

      # Fails on any high/critical advisory except the two narrow, expiring,
      # path-scoped exceptions documented in audit-ci.json (both re-verified
      # not to affect Aura's actual usage -- see that file's `notes`). No
      # other package/advisory/severity is allowlisted; this expires and
      # starts failing again on 2026-10-31 unless renewed with fresh review.
      - name: Dependency audit (audit-ci, fails on high/critical minus documented exceptions)
        run: npm run audit:ci

      - name: Verify frontend artifact contents (no secrets printed)
        run: |
          test -f dist/.htaccess || { echo "::error::dist/.htaccess is missing before upload"; exit 1; }
          echo "dist/.htaccess present: OK"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: dist
          # upload-artifact excludes dotfiles by default; dist/.htaccess
          # would silently never reach the artifact without this.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  backend:
    name: Backend test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (setup-php)
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, zip, gd
          coverage: none

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test env
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: composer test

      - name: Dependency audit
        run: composer audit

      - name: Rebuild production dependencies (no dev, no test .env)
        run: |
          rm -f .env
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Verify backend artifact contents (no secrets printed)
        run: |
          test -f public/.htaccess || { echo "::error::backend/public/.htaccess is missing before upload"; exit 1; }
          # .env.example / .env.production.example are placeholder-only
          # reference files and are expected to exist; only flag a real
          # (non-".example") .env file.
          if [ -f .env ] || find . -maxdepth 1 -name '.env.*' ! -name '*.example' | grep -q .; then
            echo "::error::A real .env file is present in the backend build directory and must not be uploaded"
            exit 1
          fi
          echo "public/.htaccess present, no non-example .env files present: OK"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-app
          # upload-artifact excludes dotfiles by default; include-hidden-files
          # below is required for backend/public/.htaccess to reach the
          # artifact at all. The explicit `!` excludes still apply on top of
          # that, so .env/.git/credentials remain excluded even with hidden
          # files on.
          include-hidden-files: true
          path: |
            backend
            !backend/tests
            !backend/.git*
            !backend/.env
            !backend/.env.*
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to production (Hostinger)
    needs: [frontend, backend]
    # Only a direct push to main can reach this job. pull_request and
    # workflow_dispatch (on any branch, including main) never satisfy this,
    # so there is no way to trigger a production deploy without having gone
    # through the full tested push-to-main pipeline above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
      BACKEND_REMOTE_PATH: domains/khajamynuddin.com/public_html/api-wellness
      FRONTEND_REMOTE_PATH: domains/khajamynuddin.com/public_html/wellness
      # Outside the deployed application directory entirely, and outside any
      # web-servable path, so backups are never touched by rsync --delete and
      # are never web-exposed regardless of document root configuration.
      BACKUP_DIR: private_backups/api-wellness
      BACKUP_RETENTION_COUNT: '10'
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-app
          path: backend-app

      - name: Download frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Locate artifact roots
        id: paths
        run: |
          # actions/upload-artifact's root-directory detection can leave an
          # extra path segment depending on the glob patterns used at upload
          # time; detect the real content root defensively rather than
          # assuming one layout.
          BACKEND_SRC=backend-app
          [ -d "backend-app/backend" ] && BACKEND_SRC=backend-app/backend
          FRONTEND_SRC=frontend-dist
          [ -d "frontend-dist/dist" ] && FRONTEND_SRC=frontend-dist/dist
          test -f "$BACKEND_SRC/public/.htaccess" || { echo "::error::Downloaded backend artifact is missing public/.htaccess"; exit 1; }
          test -f "$FRONTEND_SRC/.htaccess" || { echo "::error::Downloaded frontend artifact is missing .htaccess"; exit 1; }
          echo "backend_src=$BACKEND_SRC" >> "$GITHUB_OUTPUT"
          echo "frontend_src=$FRONTEND_SRC" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # HOSTINGER_KNOWN_HOSTS must be the real, independently-verified
          # host key line(s) for the Hostinger SSH endpoint -- see
          # docs/SECURE_PRODUCTION_DEPLOYMENT.md for how to obtain and
          # verify it. This replaces trusting a live, unverified
          # `ssh-keyscan` on every deploy.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "SSH_OPTS=-i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"

      # Aura is already deployed at this path -- there is no "first
      # deployment" case here, so this step fails closed: every required
      # file, executable and tool must already exist before anything else in
      # this job touches the server. Nothing after this step runs if any
      # check fails -- in particular, the database backup and backend rsync
      # (further below) never run.
      - name: Verify existing deployment and required tooling
        run: |
          for p in "$FRONTEND_REMOTE_PATH" "$BACKEND_REMOTE_PATH"; do
            case "$p" in
              ""|"/"|"~"|"~/")
                echo "::error::Refusing to deploy: empty or root remote path"
                exit 1
                ;;
              domains/khajamynuddin.com/public_html/*) ;;
              *)
                echo "::error::Refusing to deploy: unexpected remote path '$p'"
                exit 1
                ;;
            esac
          done

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "BACKEND_REMOTE_PATH='$BACKEND_REMOTE_PATH' FRONTEND_REMOTE_PATH='$FRONTEND_REMOTE_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -uo pipefail
          PHP=/opt/alt/php83/usr/bin/php
          FAIL=0

          for f in "$BACKEND_REMOTE_PATH/artisan" "$BACKEND_REMOTE_PATH/.env" "$FRONTEND_REMOTE_PATH/index.html"; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file missing on server: $f" >&2
              FAIL=1
            fi
          done

          if [ ! -x "$PHP" ]; then
            echo "::error::PHP executable not found or not executable: $PHP" >&2
            FAIL=1
          fi

          if ! command -v mysqldump >/dev/null 2>&1; then
            echo "::error::mysqldump not found on server" >&2
            FAIL=1
          fi

          if [ -f "$BACKEND_REMOTE_PATH/.env" ]; then
            if [ -r "$BACKEND_REMOTE_PATH/.env" ]; then
              PERM=$(stat -c '%a' "$BACKEND_REMOTE_PATH/.env" 2>/dev/null || stat -f '%Lp' "$BACKEND_REMOTE_PATH/.env")
              echo ".env is readable, permission mode: $PERM"
            else
              echo "::error::.env exists but is not readable" >&2
              FAIL=1
            fi
          fi

          [ "$FAIL" -eq 0 ] || exit 1
          REMOTE_SCRIPT

      # Back up the CURRENTLY DEPLOYED database, using the currently-deployed
      # app's own bootstrap to resolve DB config, before anything on the
      # server is touched by this deploy. Required to succeed on every
      # deploy (the previous step already guaranteed an application and
      # mysqldump exist) -- the job stops here on any failure and backend
      # rsync (next step) never runs.
      #
      # Credential handling: no .env is parsed with source/eval/grep in
      # shell. A tiny PHP snippet run through the already-deployed app's own
      # `artisan tinker` reads the live, already-resolved Laravel database
      # config in-process and writes a MySQL "option file" directly to disk
      # itself -- the password never crosses stdout, workflow logs, or a
      # command-line argument at any point, and is therefore unaffected by
      # any special characters (spaces, $, quotes, #, semicolons, ...) it may
      # contain. The option file is created under a restrictive umask,
      # chmod'd 600 immediately, and removed by a trap on every exit path.
      - name: Create database backup (before touching the server)
        run: |
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "BACKEND_REMOTE_PATH='$BACKEND_REMOTE_PATH' BACKUP_DIR='$BACKUP_DIR' BACKUP_RETENTION_COUNT='$BACKUP_RETENTION_COUNT' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          PHP=/opt/alt/php83/usr/bin/php

          command -v mysqldump >/dev/null 2>&1 || { echo "mysqldump not found on server" >&2; exit 1; }

          umask 077
          mkdir -p "$HOME/$BACKUP_DIR"
          chmod 700 "$HOME/$BACKUP_DIR"

          OPTFILE=$(mktemp)
          chmod 600 "$OPTFILE"
          # Dump into a temp file in the same (already-restricted) backup
          # directory -- no ".sql" suffix, so retention's `*.sql` glob below
          # never sees it -- and remove it on any exit. Only a validated,
          # complete dump is ever renamed to its final "pre-deploy-*.sql"
          # name, so a failed or interrupted mysqldump can never leave
          # behind a partial file that looks like a real backup.
          BACKUP_TMP=$(mktemp "$HOME/$BACKUP_DIR/pre-deploy.XXXXXX")
          chmod 600 "$BACKUP_TMP"
          trap 'rm -f "$OPTFILE" "$BACKUP_TMP"' EXIT

          cd "$BACKEND_REMOTE_PATH"

          OPTFILE="$OPTFILE" "$PHP" artisan tinker --execute="
            \$conn = config('database.default');
            \$c = config('database.connections.' . \$conn);
            if (!is_array(\$c)) { fwrite(STDERR, 'Invalid or missing database connection config' . PHP_EOL); exit(1); }
            foreach (['host','username','password'] as \$k) {
              if (!isset(\$c[\$k]) || is_array(\$c[\$k]) || \$c[\$k] === '') {
                fwrite(STDERR, 'Missing or invalid database config key: ' . \$k . PHP_EOL);
                exit(1);
              }
            }
            \$bs = chr(92); \$dq = chr(34);
            \$map = [
              \$bs => \$bs . \$bs,
              \$dq => \$bs . \$dq,
              chr(8) => \$bs . 'b',
              chr(9) => \$bs . 't',
              chr(10) => \$bs . 'n',
              chr(13) => \$bs . 'r',
            ];
            \$esc = function (\$v) use (\$map, \$dq) {
              return \$dq . strtr((string) \$v, \$map) . \$dq;
            };
            \$lines = ['[client]'];
            \$lines[] = 'host=' . \$esc(\$c['host']);
            \$lines[] = 'user=' . \$esc(\$c['username']);
            \$lines[] = 'password=' . \$esc(\$c['password']);
            if (!empty(\$c['port'])) { \$lines[] = 'port=' . \$esc(\$c['port']); }
            if (!empty(\$c['unix_socket'])) { \$lines[] = 'socket=' . \$esc(\$c['unix_socket']); }
            \$path = getenv('OPTFILE');
            \$data = implode(PHP_EOL, \$lines) . PHP_EOL;
            \$written = file_put_contents(\$path, \$data);
            if (\$written === false || \$written !== strlen(\$data)) { fwrite(STDERR, 'Failed to write option file' . PHP_EOL); exit(1); }
            if (!chmod(\$path, 0600)) { fwrite(STDERR, 'Failed to chmod option file' . PHP_EOL); exit(1); }
          " >/dev/null

          DB_NAME=$("$PHP" artisan tinker --execute="
            \$c = config('database.connections.' . config('database.default'));
            echo is_array(\$c) && isset(\$c['database']) && !is_array(\$c['database']) ? \$c['database'] : '';
          ")
          if [ -z "$DB_NAME" ]; then
            echo "::error::Could not resolve database name from Laravel config" >&2
            exit 1
          fi

          BACKUP_FILE="$HOME/$BACKUP_DIR/pre-deploy-$(date +%Y%m%d%H%M%S).sql"
          mysqldump --defaults-extra-file="$OPTFILE" --single-transaction --quick --skip-lock-tables --no-tablespaces "$DB_NAME" > "$BACKUP_TMP"
          if [ ! -s "$BACKUP_TMP" ]; then
            echo "::error::Database backup is empty: $BACKUP_TMP" >&2
            exit 1
          fi
          chmod 600 "$BACKUP_TMP"
          mv -- "$BACKUP_TMP" "$BACKUP_FILE"
          echo "Backup written: $BACKUP_FILE"

          # Retention: keep only the most recent N backups so this directory
          # cannot grow indefinitely. The `*.sql` glob only ever matches
          # completed, renamed backups -- the in-progress temp file above has
          # no ".sql" suffix, so a dump still being written (or one that
          # failed and was cleaned up by the trap) is never a candidate here.
          cd "$HOME/$BACKUP_DIR"
          ls -1t -- *.sql 2>/dev/null | tail -n "+$((BACKUP_RETENTION_COUNT + 1))" | while IFS= read -r old; do
            rm -f -- "$old"
          done
          REMOTE_SCRIPT

      - name: Deploy backend
        env:
          BACKEND_SRC: ${{ steps.paths.outputs.backend_src }}
        run: |
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$BACKEND_REMOTE_PATH'"
          rsync -avz --delete \
            --exclude='.git*' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='/storage/' \
            --exclude='/public/storage' \
            -e "ssh $SSH_OPTS" \
            "$BACKEND_SRC/" \
            "$SSH_USER@$SSH_HOST:$BACKEND_REMOTE_PATH/"

      - name: Prepare runtime directories, migrate, and warm caches
        run: |
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "BACKEND_REMOTE_PATH='$BACKEND_REMOTE_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          PHP=/opt/alt/php83/usr/bin/php
          cd "$BACKEND_REMOTE_PATH"

          # rsync's excludes above deliberately never delete these, but a
          # first-ever deploy has none of them yet -- create anything
          # missing before Artisan needs it.
          mkdir -p storage/app/public \
                   storage/logs \
                   storage/framework/sessions \
                   storage/framework/views \
                   storage/framework/cache/data \
                   bootstrap/cache

          "$PHP" artisan migrate --force
          "$PHP" artisan config:cache
          "$PHP" artisan route:cache
          "$PHP" artisan storage:link
          REMOTE_SCRIPT

      - name: Backend health check
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://api-wellness.khajamynuddin.com/api/health || echo 000)
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Backend health check failed (last status: $STATUS)"
          exit 1

      - name: Deploy frontend
        env:
          FRONTEND_SRC: ${{ steps.paths.outputs.frontend_src }}
        run: |
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$FRONTEND_REMOTE_PATH'"
          rsync -avz --delete \
            -e "ssh $SSH_OPTS" \
            "$FRONTEND_SRC/" \
            "$SSH_USER@$SSH_HOST:$FRONTEND_REMOTE_PATH/"

      - name: Final health check (frontend)
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://wellness.khajamynuddin.com/ || echo 000)
            if [ "$STATUS" = "200" ]; then
              echo "Frontend healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Frontend health check failed (last status: $STATUS)"
          exit 1
